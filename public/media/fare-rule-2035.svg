<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
  <title id="t">The 2035 fare rule</title>
  <desc id="d">Leaving at your usual time is peak and costs $15.00 every day. Leaving earlier or later is off-peak and gets a discount that depends on the day of the week, up to 45 percent. Each office day is one trip.</desc>
  <rect width="720" height="560" rx="28" fill="#FBFAFF"/>

  <!-- headline -->
  <text x="360" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#1E1B4B" letter-spacing="1">THE 2035 FARE RULE</text>
  <text x="360" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#4B4870">The same rule applies on every office day.</text>

  <!-- ===== left panel: peak ===== -->
  <rect x="24" y="124" width="324" height="340" rx="22" fill="#FFFFFF" stroke="#E4DDF7" stroke-width="2"/>
  <rect x="44" y="142" width="284" height="44" rx="22" fill="#EDE7FB"/>
  <text x="186" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E2A63">Usual time = Peak</text>

  <!-- clock -->
  <circle cx="110" cy="262" r="46" fill="#FFFFFF" stroke="#6D4FC2" stroke-width="7"/>
  <g stroke="#6D4FC2" stroke-width="5" stroke-linecap="round">
    <line x1="110" y1="262" x2="110" y2="232"/>
    <line x1="110" y1="262" x2="128" y2="272"/>
  </g>
  <circle cx="110" cy="262" r="5" fill="#6D4FC2"/>

  <!-- crowded train -->
  <rect x="178" y="220" width="140" height="86" rx="18" fill="#EDE7FB" stroke="#6D4FC2" stroke-width="4"/>
  <rect x="192" y="234" width="112" height="34" rx="8" fill="#FFFFFF"/>
  <g fill="#3B3570">
    <circle cx="206" cy="246" r="6"/><rect x="200" y="252" width="12" height="16" rx="4"/>
    <circle cx="226" cy="246" r="6"/><rect x="220" y="252" width="12" height="16" rx="4"/>
    <circle cx="246" cy="246" r="6"/><rect x="240" y="252" width="12" height="16" rx="4"/>
    <circle cx="266" cy="246" r="6"/><rect x="260" y="252" width="12" height="16" rx="4"/>
    <circle cx="286" cy="246" r="6"/><rect x="280" y="252" width="12" height="16" rx="4"/>
  </g>
  <rect x="178" y="282" width="140" height="8" fill="#6D4FC2"/>
  <circle cx="204" cy="312" r="8" fill="#3B3570"/><circle cx="292" cy="312" r="8" fill="#3B3570"/>
  <text x="248" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4B4870">busy peak</text>

  <!-- price tag -->
  <g transform="translate(186 394)">
    <rect x="-118" y="-30" width="236" height="60" rx="16" fill="#FFF4DC" stroke="#E9C98B" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#1E1B4B">$15.00</text>
  </g>
  <text x="186" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#4B4870">every day</text>

  <!-- ===== right panel: off-peak ===== -->
  <rect x="372" y="124" width="324" height="340" rx="22" fill="#FFFFFF" stroke="#E4DDF7" stroke-width="2"/>
  <rect x="392" y="142" width="284" height="44" rx="22" fill="#EDE7FB"/>
  <text x="534" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E2A63">Earlier or later = Off-peak</text>

  <!-- clock with earlier/later arrows -->
  <circle cx="456" cy="262" r="46" fill="#FFFFFF" stroke="#6D4FC2" stroke-width="7"/>
  <g stroke="#6D4FC2" stroke-width="5" stroke-linecap="round">
    <line x1="456" y1="262" x2="456" y2="232"/>
    <line x1="456" y1="262" x2="474" y2="272"/>
  </g>
  <circle cx="456" cy="262" r="5" fill="#6D4FC2"/>
  <g fill="none" stroke="#9C86DD" stroke-width="5" stroke-linecap="round">
    <path d="M404 230 A62 62 0 0 1 430 206"/>
    <path d="M482 206 A62 62 0 0 1 508 230"/>
  </g>
  <path d="M398 220 l6 14 l10 -10 z" fill="#9C86DD"/>
  <path d="M514 220 l-6 14 l-10 -10 z" fill="#9C86DD"/>

  <!-- calendar with question-mark tags (no specific day/discount pairing) -->
  <rect x="530" y="216" width="146" height="112" rx="14" fill="#FFFFFF" stroke="#6D4FC2" stroke-width="4"/>
  <rect x="530" y="216" width="146" height="28" rx="14" fill="#6D4FC2"/>
  <rect x="530" y="232" width="146" height="12" fill="#6D4FC2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="548" y="237">M</text><text x="575" y="237">T</text><text x="603" y="237">W</text><text x="631" y="237">T</text><text x="658" y="237">F</text>
  </g>
  <g fill="#EDE7FB">
    <rect x="538" y="256" width="22" height="22" rx="5"/><rect x="565" y="256" width="22" height="22" rx="5"/><rect x="592" y="256" width="22" height="22" rx="5"/><rect x="619" y="256" width="22" height="22" rx="5"/><rect x="646" y="256" width="22" height="22" rx="5"/>
    <rect x="538" y="290" width="22" height="22" rx="5"/><rect x="565" y="290" width="22" height="22" rx="5"/><rect x="592" y="290" width="22" height="22" rx="5"/><rect x="619" y="290" width="22" height="22" rx="5"/><rect x="646" y="290" width="22" height="22" rx="5"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6D4FC2" text-anchor="middle">
    <text x="549" y="273">%</text><text x="576" y="273">%</text><text x="603" y="273">%</text><text x="630" y="273">%</text><text x="657" y="273">%</text>
  </g>
  <text x="603" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4B4870">usually less crowded</text>

  <!-- discount tag -->
  <g transform="translate(534 394)">
    <rect x="-136" y="-30" width="272" height="60" rx="16" fill="#FFF4DC" stroke="#E9C98B" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1E1B4B">0–45% off</text>
  </g>
  <text x="534" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#4B4870">depends on the day</text>

  <!-- footer -->
  <rect x="24" y="484" width="672" height="52" rx="26" fill="#EDE7FB"/>
  <text x="360" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#2E2A63">Each office day = one trip · Your table for each day is below</text>

  <!-- small plant accents -->
  <g fill="#8BC34A">
    <ellipse cx="40" cy="110" rx="9" ry="16" transform="rotate(-25 40 110)"/>
    <ellipse cx="54" cy="104" rx="8" ry="14" transform="rotate(20 54 104)"/>
    <ellipse cx="680" cy="110" rx="9" ry="16" transform="rotate(25 680 110)"/>
    <ellipse cx="666" cy="104" rx="8" ry="14" transform="rotate(-20 666 104)"/>
  </g>
</svg>
